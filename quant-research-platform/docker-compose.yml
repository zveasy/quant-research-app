version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped

  agent-api:
    build: ./services/agent-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"

  worker:
    build: ./services/worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data

  dashboard:
    build: ./services/dashboard
    restart: unless-stopped
    env_file: .env
    depends_on:
      - agent-api
    ports:
      - "3000:3000"

  quantengine-bridge:
    build: ./services/quantengine-bridge
    restart: unless-stopped
    env_file: .env
    depends_on:
      - agent-api
    ports:
      - "9001:9001"

  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - agent-api
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
